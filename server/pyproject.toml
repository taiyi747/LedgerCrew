[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ledgercrew-agents"
version = "0.1.0"
description = "LedgerCrew MVP MiMo agents and resumable Microsoft Agent Framework workflow"
requires-python = ">=3.14,<3.15"
dependencies = [
  "agent-framework-core==1.24.0",
  "agent-framework-openai==1.18.0",
  "pydantic>=2.12,<3",
  "python-dotenv>=1,<2",
  "httpx>=0.28,<1",
  "openai==3.46.0",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[project.scripts]
ledgercrew-ai = "app.agents.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--basetemp=.pytest_tmp"
markers = ["live: explicitly opted-in real MiMo calls"]

[tool.uv]
constraint-dependencies = ["jiter==0.18.0"]

[tool.ruff]
target-version = "py314"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF", "SIM"]
ignore = ["RUF001", "RUF002", "RUF003"]
