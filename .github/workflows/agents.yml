name: Backend and AI Python 3.11

on:
  push:
    paths: ["server/**", "contracts/**", "fixtures/**", "AGENTS.md", "docs/P2_DECISIONS.md", ".github/workflows/agents.yml"]
  pull_request:
    paths: ["server/**", "contracts/**", "fixtures/**", "AGENTS.md", "docs/P2_DECISIONS.md", ".github/workflows/agents.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv sync --project server --frozen --extra dev
      - run: uv run --project server --frozen --extra dev python -m compileall -q server/app server/scripts server/tests contracts
      - run: uv run --project server --frozen --extra dev ruff check server/app/agents server/scripts server/tests/agents
      - run: uv run --project server --frozen --extra dev ruff check --config server/pyproject.toml contracts
      - run: uv run --project server --frozen --extra dev pytest server/tests -q
