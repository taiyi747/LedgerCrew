<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账清社 · 智能清账中台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ 顶部栏 ============ -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="clock" id="clock">17:11:05</span>
      <button class="pill-btn">
        <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        演示模式
      </button>
    </div>

    <div class="topbar-center">
      <svg viewBox="0 0 24 24" class="logo-ic"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>
      <span class="logo-text">账清社<span class="logo-sub">智能清账中台</span></span>
    </div>

    <div class="topbar-right">
      <div class="stat"><b id="stat-total">12</b><span>总任务</span></div>
      <div class="stat"><b id="stat-processing">2</b><span>处理中</span></div>
      <div class="stat"><b id="stat-delivered">17</b><span>已交付</span></div>
      <div class="stat"><b id="stat-latency">—</b><span>平均时效</span></div>
      <div class="topbar-icons">
        <svg viewBox="0 0 24 24" class="ic green"><path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5 12a11 11 0 0 1 14 0"/><path d="M8.5 15.5a6 6 0 0 1 7 0"/><circle cx="12" cy="19" r="1.2"/></svg>
        <svg viewBox="0 0 24 24" class="ic"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="8" r="0.8" fill="currentColor"/></svg>
        <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
      </div>
    </div>
  </header>

  <!-- ============ 实时消息条 ============ -->
  <section class="ticker">
    <div class="ticker-title">
      <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      实时消息
    </div>
    <div class="ticker-items" id="ticker-items"></div>
    <div class="ticker-alert" id="ticker-alert">
      <svg viewBox="0 0 24 24" class="ic"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/></svg>
      风险
      <span class="alert-sep"></span>
      <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg>
      无风险
    </div>
  </section>

  <!-- ============ 客户需求下发 ============ -->
  <section class="task-bar">
    <div class="task-bar-main">
      <span class="task-label">
        <svg viewBox="0 0 24 24" class="ic"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        客户需求
      </span>
      <input id="task-input" class="task-input" type="text"
             placeholder="例如：为客户「星辰科技」核对 3 月票据并出具交付报告"
             value="为客户「星辰科技」核对 3 月票据并出具交付报告">
      <button id="task-submit" class="task-btn">
        <svg viewBox="0 0 24 24" class="ic"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>
        下发任务
      </button>
    </div>
    <div class="task-bar-side">
      <span class="task-hint" id="task-hint">任务将依次流经：客户接待 → 票据处理 → 数据核对 → 风险与交付</span>
    </div>
  </section>

  <!-- ============ 清账主线（母意象：杂乱票据堆 → 清晰报告） ============ -->
  <section class="motive">
    <div class="motive-head">
      <span class="m-dot"></span>
      <b>清账主线</b>
      <em>从杂乱票据堆 → 清晰报告</em>
      <span class="m-tags">
        <i class="tag ok">已核对 ✓</i>
        <i class="tag ok">已核验</i>
        <i class="tag ok">已审批</i>
        <i class="tag warn">待说明</i>
        <i class="tag bad">异常</i>
        <i class="tag ok">已归档</i>
      </span>
    </div>
    <div class="motive-stage">
      <!-- 左：杂乱票据堆 -->
      <div class="pile">
        <div class="bill" style="--r:-13deg; left:2px;  top:26px;"><i></i><i></i><i></i></div>
        <div class="bill" style="--r:9deg;   left:36px; top:12px;"><i></i><i></i><i></i></div>
        <div class="bill" style="--r:-6deg;  left:70px; top:30px;"><i></i><i></i><i></i></div>
        <div class="bill" style="--r:15deg;  left:18px; top:48px;"><i></i><i></i><i></i></div>
        <div class="bill" style="--r:-18deg; left:96px; top:52px;"><i></i><i></i><i></i></div>
        <div class="bill" style="--r:5deg;   left:58px; top:56px;"><i></i><i></i><i></i></div>
        <div class="bill" style="--r:-3deg;  left:118px;top:20px;"><i></i><i></i><i></i></div>
      </div>
      <div class="pile-label">杂乱票据</div>

      <!-- 飞行中的票据 -->
      <div class="fly f1"></div>
      <div class="fly f2"></div>
      <div class="fly f3"></div>
      <div class="fly f4"></div>

      <!-- 中：清账引擎 -->
      <div class="hub">
        <div class="hub-ring"></div>
        <div class="hub-ring r2"></div>
        <div class="hub-core">
          <svg viewBox="0 0 24 24" class="ic"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
        </div>
        <span>清账引擎</span>
      </div>

      <!-- 右：清晰报告 -->
      <div class="report">
        <div class="rp-head">
          <span class="rp-title">对账报告 #R-0621</span>
          <span class="stamp-inline">已核验</span>
        </div>
        <div class="rp-row"><i>✓</i><span>票据 128 笔已清点</span><b>已核对</b></div>
        <div class="rp-row"><i>✓</i><span>流水一致 ¥1,286,400</span><b>已核验</b></div>
        <div class="rp-row"><i>✓</i><span>差异 2 项已说明</span><b>已审批</b></div>
        <div class="rp-row"><i>✓</i><span>报告生成完毕</span><b>已归档</b></div>
      </div>
    </div>
  </section>

  <!-- ============ 四模块流水线（由 js/main.js 渲染） ============ -->
  <main class="pipeline" id="pipeline"></main>

  <!-- ============ 底部悬浮导航 ============ -->
  <nav class="dock">
    <button class="dock-item active">
      <svg viewBox="0 0 24 24" class="ic"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
      作战室
    </button>
    <button class="dock-item">
      <svg viewBox="0 0 24 24" class="ic"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
      仪表盘
    </button>
    <button class="dock-item">
      <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
      设置
    </button>
  </nav>

  <!-- ============ 右下角小工具条 ============ -->
  <div class="corner-tools">
    <svg viewBox="0 0 24 24" class="ic green"><path d="M5 3l14 8-6 2-2 6z"/></svg>
    <svg viewBox="0 0 24 24" class="ic green"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 1 4 10.5V16H8v-2.5A6 6 0 0 1 12 3z"/></svg>
    <svg viewBox="0 0 24 24" class="ic green"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>
    <svg viewBox="0 0 24 24" class="ic green"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    <span class="ai-chip">Ai</span>
  </div>

  <!-- ============ 交付提示 ============ -->
  <div class="toast" id="toast"></div>

  <!-- 后端地址配置：联调/上线时取消注释并改成实际后端地址（详见 api/接口文档.md） -->
  <!-- <script>window.AIWHO_API_BASE = "http://localhost:3000";</script> -->
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
