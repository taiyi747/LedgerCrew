<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前端工具箱 · 小猫严选</title>
<style>
/* ================= 全局 ================= */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg: #f4f5f7;
  --panel: #ecedef;
  --card: #fff;
  --line: #e3e5e8;
  --line-dark: #cfd3d9;
  --ink: #17181c;
  --gray: #8a8f98;
  --blue: #3b82f6;
  --amber: #f59e0b;
  --teal: #14b8a6;
  --green: #22c55e;
  --red: #ef4444;
  --screen: #22304c;
  --r-card: 16px;
  --r-in: 10px;
  --shadow: 0 6px 18px rgba(23, 24, 28, .07);
  --shadow-lift: 0 16px 36px rgba(23, 24, 28, .12);
  --ease: cubic-bezier(.22, 1, .36, 1);
}

html { scroll-behavior: smooth; }

body {
  font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  background: var(--bg);
  color: var(--ink);
  padding: 0 16px 90px;
  overflow-x: hidden;
  line-height: 1.6;
}

.wrap { max-width: 1280px; margin: 0 auto; }

/* ================= 顶栏 ================= */
.topbar {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  height: 58px;
  background: rgba(244, 245, 247, .92);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}

.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 30px; height: 30px;
  border-radius: 9px;
  background: var(--ink);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.brand-mark svg { width: 19px; height: 19px; stroke: #fff; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.brand-text { font-size: 16px; font-weight: 700; letter-spacing: .3px; }
.brand-sub { font-size: 11px; color: var(--gray); margin-left: 2px; }

.top-nav { display: flex; align-items: center; gap: 6px; }
.nav-chip {
  padding: 5px 13px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--card);
  color: var(--ink);
  font-size: 12px;
  font-family: inherit;
  cursor: pointer;
  white-space: nowrap;
  transition: background .2s, color .2s, border-color .2s, transform .15s;
}
.nav-chip:hover { transform: translateY(-1px); border-color: var(--line-dark); }
.nav-chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }

.top-stat { display: flex; align-items: center; gap: 18px; }
.stat { text-align: center; line-height: 1.2; }
.stat b { display: block; font-size: 15px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 10px; color: var(--gray); }

/* ================= 主视觉 ================= */
.hero {
  position: relative;
  margin: 18px 0 8px;
  padding: 34px 30px 26px;
  border-radius: 20px;
  border: 1px solid var(--line);
  background:
    radial-gradient(rgba(0, 0, 0, .045) 1px, transparent 1px),
    linear-gradient(180deg, #fff, #f7f8fa);
  background-size: 24px 24px, 100% 100%;
  overflow: hidden;
}

.hero-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 28px;
  flex-wrap: wrap;
}

.hero-copy { flex: 1 1 420px; min-width: 0; }

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 12px;
  border-radius: 999px;
  background: var(--panel);
  border: 1px solid var(--line);
  font-size: 11px;
  color: var(--gray);
  margin-bottom: 14px;
}
.eyebrow i {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green);
  animation: tc-blink 1.6s ease infinite;
}

h1 {
  font-size: clamp(28px, 4.6vw, 44px);
  line-height: 1.18;
  letter-spacing: -.5px;
  margin-bottom: 12px;
}
h1 em {
  font-style: normal;
  position: relative;
  z-index: 0;
  white-space: nowrap;
}
h1 em::after {
  content: "";
  position: absolute;
  left: -2px; right: -2px; bottom: 3px;
  height: 11px;
  background: rgba(245, 158, 11, .32);
  border-radius: 3px;
  z-index: -1;
  transform: rotate(-.6deg);
}

.hero-lede {
  font-size: 15px;
  color: var(--gray);
  max-width: 560px;
  margin-bottom: 20px;
}
.hero-lede b { color: var(--ink); font-weight: 700; }

.hero-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 9px 18px;
  border-radius: 999px;
  border: 1px solid transparent;
  font-size: 13px;
  font-family: inherit;
  font-weight: 600;
  cursor: pointer;
  transition: transform .16s var(--ease), background .2s, box-shadow .2s;
}
.btn:hover { transform: translateY(-2px); }
.btn-dark { background: var(--ink); color: #fff; box-shadow: 0 6px 16px rgba(23, 24, 28, .18); }
.btn-ghost { background: var(--card); color: var(--ink); border-color: var(--line); }
.btn-ghost:hover { border-color: var(--line-dark); }

/* 主视觉小猫排排坐 */
.hero-crew {
  flex: 0 1 460px;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 4px;
  padding: 66px 0 6px;
}
.crew-item { position: relative; width: 25%; max-width: 118px; }
.crew-item .cat { width: 100%; height: auto; display: block; }

.bubble {
  position: absolute;
  top: -34px; left: 50%;
  transform: translateX(-50%);
  padding: 5px 11px;
  background: #fff;
  border: 1.5px solid var(--ink);
  border-radius: 12px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  box-shadow: 2px 3px 0 rgba(23, 24, 28, .12);
  opacity: 0;
  animation: bub-up .5s var(--ease) both;
}
.bubble::after {
  content: "";
  position: absolute;
  left: 50%; bottom: -6px;
  width: 9px; height: 9px;
  background: #fff;
  border-right: 1.5px solid var(--ink);
  border-bottom: 1.5px solid var(--ink);
  transform: translateX(-50%) rotate(45deg);
}
.crew-item:nth-child(1) .bubble { animation-delay: .15s; }
.crew-item:nth-child(2) .bubble { animation-delay: .35s; top: -46px; }
.crew-item:nth-child(3) .bubble { animation-delay: .55s; }
.crew-item:nth-child(4) .bubble { animation-delay: .75s; top: -46px; }

@keyframes bub-up {
  from { opacity: 0; transform: translateX(-50%) translateY(10px) scale(.85); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); }
}

/* ================= 分类区块 ================= */
.group { margin-top: 34px; scroll-margin-top: 76px; }

.group-head {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
  flex-wrap: wrap;
}

.group-no {
  width: 30px; height: 30px;
  border-radius: 9px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 12px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.group-title { font-size: 20px; font-weight: 700; letter-spacing: -.2px; }
.group-note { font-size: 12px; color: var(--gray); }
.group-count {
  margin-left: auto;
  padding: 3px 11px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
}

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
  gap: 14px;
}

/* ================= 工具卡 ================= */
.card {
  --accent: var(--blue);
  --accent-soft: rgba(59, 130, 246, .14);
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 14px 14px 12px;
  border: 2px solid transparent;
  border-radius: var(--r-card);
  background:
    radial-gradient(rgba(0, 0, 0, .05) 1px, transparent 1px),
    var(--panel);
  background-size: 26px 26px;
  transition: border-color .35s, box-shadow .35s, transform .35s;
}
.card:hover {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft), var(--shadow-lift);
  transform: translateY(-5px);
}

.card[data-accent="blue"]  { --accent: var(--blue);  --accent-soft: rgba(59, 130, 246, .14); }
.card[data-accent="amber"] { --accent: var(--amber); --accent-soft: rgba(245, 158, 11, .16); }
.card[data-accent="teal"]  { --accent: var(--teal);  --accent-soft: rgba(20, 184, 166, .16); }
.card[data-accent="green"] { --accent: var(--green); --accent-soft: rgba(34, 197, 94, .16); }

.card-head { display: flex; align-items: center; gap: 9px; }

.card-no {
  width: 24px; height: 24px;
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 11px;
  font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.card-name {
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -.1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.card-name small {
  font-size: 11px;
  font-weight: 500;
  color: var(--gray);
  margin-left: 6px;
  letter-spacing: 0;
}

.card-chip {
  margin-left: auto;
  padding: 3px 10px;
  border-radius: 999px;
  background: #fff;
  border: 1px solid var(--line);
  font-size: 11px;
  color: var(--gray);
  white-space: nowrap;
  flex-shrink: 0;
}
.card-chip.hot {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

/* 舞台：显示器 + 小猫 */
.scene {
  position: relative;
  display: flex;
  align-items: flex-end;
  gap: 4px;
  padding: 20px 2px 0;
}
.monitor { width: 56%; flex-shrink: 0; }

.screen {
  position: relative;
  height: 122px;
  border-radius: 10px;
  background: linear-gradient(160deg, #22304c, #1a2740);
  box-shadow: inset 0 0 0 3px #22304c, 0 6px 14px rgba(34, 48, 76, .25);
  overflow: hidden;
}
.screen::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(115deg, transparent 42%, rgba(255, 255, 255, .07) 50%, transparent 58%);
  pointer-events: none;
}
.stand {
  width: 34%; height: 7px;
  margin: 3px auto 0;
  border-radius: 0 0 6px 6px;
  background: var(--screen);
}
.stand-base {
  width: 52%; height: 5px;
  margin: 0 auto;
  border-radius: 4px;
  background: #2c3d5e;
}

.cat-wrap {
  width: 44%;
  display: flex;
  justify-content: center;
  position: relative;
  z-index: 2;
}
.cat { width: 100%; max-width: 138px; height: auto; display: block; }

.card:hover .cat .tail { animation: cat-tail-fast 1.1s ease-in-out infinite; }
.card:hover .cat .paw-l { animation: cat-type .32s ease-in-out infinite alternate; }
.card:hover .cat .paw-r { animation: cat-type .32s ease-in-out infinite alternate-reverse; }

.spark {
  position: absolute;
  z-index: 4;
  font-size: 13px;
  color: var(--accent);
  opacity: 0;
  pointer-events: none;
}
.card:hover .spark { animation: spark-pop 1s ease both; }
.spark.s1 { top: 22px; left: 54%; }
.spark.s2 { top: 52px; left: 46%; animation-delay: .18s !important; }
.spark.s3 { top: 36px; right: 6%; animation-delay: .32s !important; }

.card-body { display: flex; flex-direction: column; gap: 9px; }

.card-desc {
  font-size: 13px;
  color: var(--ink);
  line-height: 1.62;
}

.tag-row { display: flex; flex-wrap: wrap; gap: 5px; }
.tag {
  padding: 2.5px 9px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.tag.plain { background: #fff; color: var(--gray); border: 1px solid var(--line); }

.use-line {
  display: flex;
  gap: 7px;
  font-size: 12px;
  color: var(--gray);
  line-height: 1.55;
}
.use-line b {
  flex-shrink: 0;
  color: var(--accent);
  font-weight: 700;
}

/* 安装条 */
.install {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: auto;
  padding: 8px 8px 8px 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--r-in);
}
.install code {
  flex: 1;
  min-width: 0;
  font-family: Consolas, "SF Mono", Menlo, monospace;
  font-size: 11.5px;
  color: var(--ink);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.copy-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 4px 11px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  color: var(--gray);
  font-size: 11px;
  font-family: inherit;
  cursor: pointer;
  flex-shrink: 0;
  transition: background .2s, color .2s, border-color .2s;
}
.copy-btn:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
.copy-btn.done { background: var(--green); border-color: var(--green); color: #fff; }
.copy-btn.fail { background: var(--red); border-color: var(--red); color: #fff; }

.link-row {
  display: flex;
  gap: 8px;
  font-size: 11px;
}
.link-row a {
  color: var(--gray);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  transition: color .2s;
}
.link-row a:hover { color: var(--accent); }
.link-row a::after { content: "↗"; font-size: 10px; opacity: .7; }

/* ================= 屏幕内容 ================= */
.scr { position: absolute; inset: 0; padding: 11px 11px; font-size: 8.5px; color: #c9d5ea; }

.code {
  font-family: Consolas, "SF Mono", Menlo, monospace;
  font-size: 8.5px;
  line-height: 1.72;
  white-space: pre;
  color: #b9c7e0;
}
.code .k { color: #7cc4ff; }
.code .s { color: #9be8a8; }
.code .n { color: #f0b872; }
.code .c { color: #6b7c99; }

/* 图标墙 */
.icon-wall {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  padding-top: 4px;
}
.icon-wall i {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 22px;
  border-radius: 6px;
  background: rgba(255, 255, 255, .08);
}
.icon-wall svg { width: 13px; height: 13px; stroke: #9db4d6; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* 迷你柱状图 */
.bars {
  display: flex;
  align-items: flex-end;
  gap: 7px;
  height: 84px;
  padding: 6px 2px 0;
}
.bars b {
  flex: 1;
  border-radius: 4px 4px 2px 2px;
  background: linear-gradient(180deg, var(--accent), rgba(255, 255, 255, .18));
  opacity: .9;
  animation: bar-grow 1.5s var(--ease) both;
}
.bars b:nth-child(1) { height: 42%; animation-delay: .1s; }
.bars b:nth-child(2) { height: 68%; animation-delay: .22s; }
.bars b:nth-child(3) { height: 51%; animation-delay: .34s; }
.bars b:nth-child(4) { height: 88%; animation-delay: .46s; }
.bars b:nth-child(5) { height: 73%; animation-delay: .58s; }
.bars b:nth-child(6) { height: 96%; animation-delay: .7s; }
@keyframes bar-grow { from { transform: scaleY(.05); transform-origin: bottom; opacity: 0; } to { transform: scaleY(1); opacity: .9; } }

.spark-line { margin-top: 6px; }
.spark-line svg { width: 100%; height: 26px; display: block; }
.spark-line path { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-dasharray: 220; stroke-dashoffset: 220; animation: draw 1.8s var(--ease) .3s both; }
@keyframes draw { to { stroke-dashoffset: 0; } }

/* 拖拽列表 */
.drag-list { display: flex; flex-direction: column; gap: 5px; padding-top: 2px; }
.drag-row {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 8px;
  border-radius: 7px;
  background: rgba(255, 255, 255, .10);
  font-size: 8.5px;
  color: #cfdcef;
}
.drag-row u {
  width: 9px; height: 2px;
  border-radius: 2px;
  background: rgba(255, 255, 255, .28);
  box-shadow: 0 3px 0 rgba(255, 255, 255, .28), 0 -3px 0 rgba(255, 255, 255, .28);
  flex-shrink: 0;
}
.drag-row.mid {
  background: rgba(59, 130, 246, .42);
  transform: translateX(10px) rotate(-1.4deg);
  box-shadow: 0 4px 10px rgba(0, 0, 0, .22);
}

/* 提示气泡 / 浮层 */
.float-demo { position: relative; height: 100%; padding-top: 14px; }
.float-anchor {
  position: absolute;
  left: 12px; top: 46px;
  padding: 5px 12px;
  border-radius: 8px;
  background: rgba(255, 255, 255, .12);
  border: 1px solid rgba(255, 255, 255, .16);
  font-size: 8.5px;
  color: #d5e2f5;
}
.float-tip {
  position: absolute;
  left: 34px; top: 12px;
  padding: 5px 10px;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font-size: 8.5px;
  font-weight: 600;
  white-space: nowrap;
  box-shadow: 0 6px 14px rgba(0, 0, 0, .28);
  animation: tip-float 2.4s ease-in-out infinite;
}
.float-tip::after {
  content: "";
  position: absolute;
  left: 18px; bottom: -4px;
  width: 8px; height: 8px;
  background: var(--accent);
  transform: rotate(45deg);
}
@keyframes tip-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

/* 消息提示 */
.toast-stack { display: flex; flex-direction: column; gap: 6px; padding-top: 8px; }
.toast {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 7px 10px;
  border-radius: 9px;
  background: rgba(255, 255, 255, .12);
  border: 1px solid rgba(255, 255, 255, .12);
  font-size: 8.5px;
  color: #d8e4f4;
  animation: toast-in .5s var(--ease) both;
}
.toast:nth-child(2) { animation-delay: .35s; opacity: .72; }
.toast:nth-child(3) { animation-delay: .7s; opacity: .45; }
.toast i {
  width: 12px; height: 12px;
  border-radius: 50%;
  background: var(--green);
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.toast i svg { width: 8px; height: 8px; stroke: #fff; fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
@keyframes toast-in { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: translateX(0); } }

/* 手绘方框 */
.rough-box {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.rough-box svg { width: 100%; height: 88px; }
.rough-box .rb { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 300; stroke-dashoffset: 300; animation: draw 2s var(--ease) .2s both; }
.rough-box .rf { fill: var(--accent); opacity: .18; }

/* 校验表单 */
.form-demo { display: flex; flex-direction: column; gap: 6px; padding-top: 6px; }
.form-demo .fld {
  padding: 6px 9px;
  border-radius: 7px;
  background: rgba(255, 255, 255, .10);
  border: 1px solid rgba(255, 255, 255, .14);
  font-size: 8.5px;
  color: #cfdcef;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}
.form-demo .fld.bad { border-color: rgba(239, 68, 68, .7); background: rgba(239, 68, 68, .16); }
.form-demo .fld.ok  { border-color: rgba(34, 197, 94, .55); }
.form-demo .fld em { font-style: normal; font-size: 8px; opacity: .85; flex-shrink: 0; }
.form-demo .msg {
  font-size: 8px;
  color: #ff9d9d;
  padding-left: 2px;
  animation: bub-in .5s ease both;
}
@keyframes bub-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

/* 时间条 */
.time-demo { display: flex; flex-direction: column; gap: 7px; padding-top: 10px; }
.time-demo .tm {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 6px 9px;
  border-radius: 7px;
  background: rgba(255, 255, 255, .10);
  font-size: 8.5px;
  color: #cfdcef;
}
.time-demo .tm b { color: var(--accent); font-weight: 600; white-space: nowrap; }

/* 假接口 */
.mock-demo { display: flex; flex-direction: column; gap: 5px; padding-top: 6px; }
.mock-demo .mh {
  display: flex; align-items: center; gap: 6px;
  font-size: 8px; color: #8fa5c4;
}

// 复制：优先用剪贴板接口，不行退回选区复制，都失败也给个交代
function copyText(text) {
  const legacy = () => new Promise((res) => {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.cssText = "position:fixed;top:0;left:-9999px;opacity:0";
    document.body.appendChild(ta);
    ta.select();
    ta.setSelectionRange(0, text.length);
    let ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    res(ok);
  });

  if (navigator.clipboard && window.isSecureContext) {
    return navigator.clipboard.writeText(text)
      .then(() => true)
      .catch(() => legacy());
  }
  return legacy();
}

function flashLabel(el, okText, failText, ok) {
  const old = el.textContent;
  el.textContent = ok ? okText : failText;
  el.classList.toggle("done", ok);
  if (!ok) el.classList.add("fail");
  setTimeout(() => {
    el.textContent = old;
    el.classList.remove("done", "fail");
  }, 1600);
}

document.addEventListener("click", (e) => {
  const btn = e.target.closest(".copy-btn");
  if (btn) {
    copyText(btn.dataset.cmd).then((ok) => {
      flashLabel(btn, "已复制", "没复制上", ok);
    });
    return;
  }

  const chip = e.target.closest(".nav-chip");
  if (chip) {
    document.querySelectorAll(".nav-chip").forEach((c) => c.classList.remove("on"));
    chip.classList.add("on");
    const t = document.getElementById(chip.dataset.target);
    if (t) t.scrollIntoView({ behavior: "smooth", block: "start" });
  }
});

});
