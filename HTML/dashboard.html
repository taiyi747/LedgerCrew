<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AIWHO WEBHOOK 中台 · 仪表盘</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

  <!-- ============ 顶部栏（与作战室一致） ============ -->
  <header class="topbar">
    <div class="topbar-left">
      <span class="clock" id="clock">17:11:05</span>
      <button class="pill-btn">
        <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        演示模式
      </button>
    </div>

    <div class="topbar-center">
      <svg viewBox="0 0 24 24" class="logo-ic"><circle cx="12" cy="12" r="9"/><path d="M8 12h8M12 8v8"/></svg>
      <span class="logo-text">AIWHO WEBHOOK中台</span>
    </div>

    <div class="topbar-right">
      <div class="stat"><b id="stat-total">12</b><span>总任务</span></div>
      <div class="stat"><b id="stat-processing">2</b><span>处理中</span></div>
      <div class="stat"><b id="stat-delivered">17</b><span>已交付</span></div>
      <div class="stat"><b id="stat-latency">—</b><span>平均时效</span></div>
      <div class="topbar-icons">
        <svg viewBox="0 0 24 24" class="ic green"><path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5 12a11 11 0 0 1 14 0"/><path d="M8.5 15.5a6 6 0 0 1 7 0"/><circle cx="12" cy="19" r="1.2"/></svg>
        <svg viewBox="0 0 24 24" class="ic"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><circle cx="12" cy="8" r="0.8" fill="currentColor"/></svg>
        <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
      </div>
    </div>
  </header>

  <!-- ============ 仪表盘标题 + 筛选 ============ -->
  <section class="dash-head">
    <div class="dash-title">
      <svg viewBox="0 0 24 24" class="ic"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
      <h1>仪表盘</h1>
      <span class="dash-sub">全流程数据一览 · 客户接待 → 票据处理 → 数据核对 → 风险与交付</span>
    </div>
    <div class="dash-filters">
      <button class="chip active" data-range="7d">近 7 日</button>
      <button class="chip" data-range="today">今日</button>
      <button class="chip" data-range="30d">近 30 日</button>
      <span class="dash-sync" id="dash-sync">数据更新于 --:--</span>
    </div>
  </section>

  <!-- ============ KPI 卡片 ============ -->
  <section class="kpi-row" id="kpi-row"></section>

  <!-- ============ 图表区 ============ -->
  <section class="chart-row">
    <!-- 任务流转趋势 -->
    <div class="chart-card span2">
      <div class="chart-head">
        <div class="chart-title">
          <svg viewBox="0 0 24 24" class="ic"><path d="M3 17l6-6 4 4 7-8"/><path d="M14 7h6v6"/></svg>
          任务流转趋势
        </div>
        <div class="chart-legend">
          <i class="lg blue"></i>接收任务
          <i class="lg green"></i>交付任务
        </div>
        <div class="mascot" id="mascot"></div>
      </div>
      <div class="chart-body" id="trend-chart"></div>
    </div>

    <!-- 任务状态分布 -->
    <div class="chart-card">
      <div class="chart-head">
        <div class="chart-title">
          <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.5 4"/></svg>
          任务状态分布
        </div>
      </div>
      <div class="chart-body donut-body">
        <div class="donut-wrap" id="donut-chart"></div>
        <div class="donut-legend" id="donut-legend"></div>
      </div>
    </div>
  </section>

  <section class="chart-row">
    <!-- 各模块处理量 -->
    <div class="chart-card">
      <div class="chart-head">
        <div class="chart-title">
          <svg viewBox="0 0 24 24" class="ic"><rect x="3" y="12" width="4" height="8" rx="1"/><rect x="10" y="6" width="4" height="14" rx="1"/><rect x="17" y="9" width="4" height="11" rx="1"/></svg>
          各模块处理量
        </div>
      </div>
      <div class="chart-body" id="bar-chart"></div>
    </div>

    <!-- 各模块平均时效 -->
    <div class="chart-card">
      <div class="chart-head">
        <div class="chart-title">
          <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          各模块平均处理时长
        </div>
      </div>
      <div class="chart-body" id="hbar-chart"></div>
    </div>

    <!-- 核验结果 -->
    <div class="chart-card">
      <div class="chart-head">
        <div class="chart-title">
          <svg viewBox="0 0 24 24" class="ic"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M8.5 12l2.5 2.5 4.5-5"/></svg>
          核验结果
        </div>
      </div>
      <div class="chart-body" id="verify-chart"></div>
    </div>
  </section>

  <!-- ============ 最近任务 ============ -->
  <section class="table-card">
    <div class="chart-head">
      <div class="chart-title">
        <svg viewBox="0 0 24 24" class="ic"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/></svg>
        最近任务
      </div>
      <span class="table-more">查看全部 →</span>
    </div>
    <table class="task-table">
      <thead>
        <tr>
          <th>任务编号</th>
          <th>客户需求</th>
          <th>当前模块</th>
          <th>状态</th>
          <th>耗时</th>
          <th>创建时间</th>
        </tr>
      </thead>
      <tbody id="task-tbody"></tbody>
    </table>
  </section>

  <!-- ============ 底部悬浮导航（与作战室联动） ============ -->
  <nav class="dock">
    <button class="dock-item" onclick="location.href='index.html'">
      <svg viewBox="0 0 24 24" class="ic"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
      作战室
    </button>
    <button class="dock-item active" onclick="location.href='dashboard.html'">
      <svg viewBox="0 0 24 24" class="ic"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>
      仪表盘
    </button>
    <button class="dock-item">
      <svg viewBox="0 0 24 24" class="ic"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9 17 7M7 17l-2.1 2.1"/></svg>
      设置
    </button>
  </nav>

  <!-- ============ 右下角小工具条 ============ -->
  <div class="corner-tools">
    <svg viewBox="0 0 24 24" class="ic green"><path d="M5 3l14 8-6 2-2 6z"/></svg>
    <svg viewBox="0 0 24 24" class="ic green"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 1 4 10.5V16H8v-2.5A6 6 0 0 1 12 3z"/></svg>
    <svg viewBox="0 0 24 24" class="ic green"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>
    <svg viewBox="0 0 24 24" class="ic green"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    <span class="ai-chip">Ai</span>
  </div>

  <!-- 后端地址配置：联调/上线时取消注释并改成实际后端地址（详见 api/接口文档.md） -->
  <!-- <script>window.AIWHO_API_BASE = "http://localhost:3000";</script> -->
  <script src="js/api.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
